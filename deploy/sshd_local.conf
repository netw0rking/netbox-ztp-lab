# ztp-server's own SSH access, for the operator - key-only, no
# password auth at all. Loaded via sshd_config's default
# `Include /etc/ssh/sshd_config.d/*.conf` (standard on Debian/Ubuntu
# openssh-server since ~9.x). The key itself comes from the same
# admin_ssh_key.pub bind used to authorize cEOS device logins - see
# deploy/entrypoint.sh and .gitignore (deploy/admin_ssh_key.pub is
# never committed, at the user's explicit request).
PermitRootLogin prohibit-password
PasswordAuthentication no
